[package]
name = "grantria"
version = "0.2.3"
description = "Grantria web port in a Tauri shell"
edition = "2021"
publish = false

[lib]
name = "grantria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# tauri and the plugins kept on the same versions as the npm packages (@tauri-apps/api, plugin-*) in package.json
[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DualSense rumble on Windows (src/rumble.rs): the system HID API, no C library to build
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
