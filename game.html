<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: in fullscreen (Chrome, a Chrome-installed app) the page also fills the landscape status bar / camera
         cutout side instead of leaving it blank -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Grantria</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; display: block; }
      #frame { position: relative; overflow: hidden; }
      #hud { height: 24px; line-height: 24px; color: #8a8; }
      /* a phone held upright: the game is landscape (a phone browser in fullscreen turns by itself, webFullscreen) */
      #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #000; color: #ddd;
        font: 15px/1.6 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="rotate">화면을 가로로 돌려 주세요</div>
    <div id="hud"></div>
    <div id="frame">
      <div id="stage">
        <canvas id="screen" width="480" height="320"></canvas>
      </div>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
